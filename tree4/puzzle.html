<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازل العائلة</title>
<script>(function(){function s(){try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme")}catch(e){}}s();try{new MutationObserver(s).observe(parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a felt-covered work table — framed board + scattered tray, controls in a slim bar above */
:root{
  --bg:#f6f4ee; --table:#2a3f63; --table-2:#1c2c47; --frame:#9c7a3c; --fg:#1a2235; --muted:#4a5468;
  --chip:#ffffff; --chip-fg:#1a2235; --accent:#9c7a3c; --ok:#2e7d32;
  --display:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131c; --table:#1f2d48; --table-2:#121a29; --frame:#d9b874; --fg:#e9ecf2; --muted:#b8c0cf;
  --chip:#161d2a; --chip-fg:#e9ecf2; --accent:#d9b874; --ok:#81c784; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131c; --table:#1f2d48; --table-2:#121a29; --frame:#d9b874; --fg:#e9ecf2; --muted:#b8c0cf;
  --chip:#161d2a; --chip-fg:#e9ecf2; --accent:#d9b874; --ok:#81c784; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);direction:rtl;padding-inline:0;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:2px 0}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:0;text-wrap:balance}
.stats{display:flex;gap:14px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.stats b{color:var(--fg);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
select,button{font:inherit;font-size:.9rem;border-radius:8px;border:1px solid color-mix(in srgb,var(--fg) 20%,transparent);background:var(--chip);color:var(--chip-fg);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#wrap{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;
  background:radial-gradient(circle at 30% 20%,var(--table),var(--table-2));margin-bottom:4px;touch-action:none}
#stage{position:absolute;top:0;left:0;transform-origin:0 0}
#board{position:absolute;box-shadow:0 0 0 6px var(--frame),0 10px 30px #0006;background:#0000002a}
#ghost{position:absolute;inset:0;background-size:cover;opacity:0;transition:opacity .25s}
#ghost.on{opacity:.28}
.pc{position:absolute;cursor:grab;filter:drop-shadow(0 2px 3px #0008);will-change:transform}
.pc.drag{cursor:grabbing;filter:drop-shadow(0 10px 12px #000a)}
.pc.done{filter:none;cursor:default}
#win{position:absolute;inset:0;display:grid;place-items:center;background:#0008;opacity:0;pointer-events:none;transition:opacity .4s}
#win.show{opacity:1;pointer-events:auto}
.card{background:var(--bg);color:var(--fg);border-radius:14px;padding:22px 26px;text-align:center;max-width:300px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px #0008}
.card h2{font-family:var(--display);margin:0;font-size:1.6rem}
.card p{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#ghost,#win{transition:none}}
</style>
</head>
<body>

<header>
  <div class="stats"><span>الوقت <b id="t">0:00</b></span><span>القطع <b id="c">0/0</b></span></div>
  <div class="controls">
    <label for="lvl" hidden>الصعوبة</label>
    <select id="lvl">
      <option value="3">سهل · ٩ قطع</option>
      <option value="4" selected>متوسط · ١٦ قطعة</option>
      <option value="6">صعب · ٣٦ قطعة</option>
      <option value="8">خبير · ٦٤ قطعة</option>
    </select>
    <button id="peek" aria-pressed="false">إظهار الصورة</button>
    <button id="new" class="primary">لعبة جديدة</button>
  </div>
</header>
<div id="wrap"><div id="stage"><div id="board"><div id="ghost"></div></div></div>
  <div id="win"><div class="card"><h2>أحسنت!</h2><p id="wmsg"></p><button class="primary" id="again">العب مرة أخرى</button></div></div>
</div>

<script>
const SRC="img/puzzle-1.jpg";
const img=new Image(); img.src=SRC;
const wrap=document.getElementById('wrap'),stage=document.getElementById('stage'),board=document.getElementById('board');
const ghost=document.getElementById('ghost'); ghost.style.backgroundImage=`url(${SRC})`;
const B=600; // board size in stage units
let L,scale=1,pieces=[],n=4,placed=0,t0=0,timer=null,z=10,started=false;

function layout(){
  const w=wrap.clientWidth,h=wrap.clientHeight, wide=w/h>1.15;
  const m=30, tray=wide?520:420;
  L= wide? {W:B+tray+m*3,H:B+m*2,bx:w>0?tray+m*2:0,by:m,tx:m,ty:m,tw:tray,th:B}
         : {W:B+m*2,H:B+tray+m*3,bx:m,by:m,tx:m,ty:B+m*2,tw:B,th:tray};
  stage.style.width=L.W+'px';stage.style.height=L.H+'px';
  board.style.cssText=`left:${L.bx}px;top:${L.by}px;width:${B}px;height:${B}px`;
  fit();
}
function fit(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  scale=Math.min(w/L.W,h/L.H);
  stage.style.transform=`translate(${(w-L.W*scale)/2}px,${(h-L.H*scale)/2}px) scale(${scale})`;
}

function edgePath(ctx,x0,y0,x1,y1,dir){ // dir: 0 flat, 1 out, -1 in (relative to left-normal)
  if(!dir){ctx.lineTo(x1,y1);return}
  const dx=x1-x0,dy=y1-y0,nx=dy*dir,ny=-dx*dir;
  const P=(a,b)=>[x0+dx*a+nx*b,y0+dy*a+ny*b];
  const pts=[[.35,0],[.37,.05,.40,.12,.36,.18],[.32,.26,.38,.33,.50,.33],[.62,.33,.68,.26,.64,.18],[.60,.12,.63,.05,.65,0]];
  ctx.lineTo(...P(...pts[0]));
  for(let i=1;i<5;i++){const p=pts[i];ctx.bezierCurveTo(...P(p[0],p[1]),...P(p[2],p[3]),...P(p[4],p[5]))}
  ctx.lineTo(x1,y1);
}

function build(){
  stage.querySelectorAll('.pc').forEach(e=>e.remove());
  pieces=[];placed=0;started=false;clearInterval(timer);document.getElementById('t').textContent='0:00';
  document.getElementById('win').classList.remove('show');
  const cs=B/n,pad=cs*.36,S=img.naturalWidth/B;
  const H=[],V=[];
  for(let r=0;r<n;r++){H[r]=[];V[r]=[];for(let c=0;c<n;c++){H[r][c]=Math.random()<.5?1:-1;V[r][c]=Math.random()<.5?1:-1}}
  const dpr=Math.min(2,window.devicePixelRatio||1);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    // edges clockwise: top, right, bottom, left. Outward = +1 when drawn clockwise with normal flipped.
    const top=r?-V[r-1][c]:0, bottom=r<n-1?V[r][c]:0, left=c?-H[r][c-1]:0, right=c<n-1?H[r][c]:0;
    const sz=cs+pad*2, cv=document.createElement('canvas');
    cv.width=Math.ceil(sz*dpr*Math.max(1,scale*1.2));cv.height=cv.width;
    const k=cv.width/sz; cv.style.width=cv.style.height=sz+'px'; cv.className='pc';
    const ctx=cv.getContext('2d'); ctx.scale(k,k);
    const a=pad,b=pad+cs;
    ctx.beginPath();ctx.moveTo(a,a);
    edgePath(ctx,a,a,b,a,top);
    edgePath(ctx,b,a,b,b,right);edgePath(ctx,b,b,a,b,bottom);edgePath(ctx,a,b,a,a,left);
    ctx.closePath();ctx.save();ctx.clip();
    ctx.drawImage(img,(c*cs-pad)*S,(r*cs-pad)*S,sz*S,sz*S,0,0,sz,sz);
    ctx.restore();ctx.lineWidth=1.2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
    ctx.lineWidth=.8;ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();
    const p={el:cv,r,c,tx:L.bx+c*cs-pad,ty:L.by+r*cs-pad,x:0,y:0,done:false,sz,pad};
    p.x=L.tx+Math.random()*(L.tw-cs)-pad; p.y=L.ty+Math.random()*(L.th-cs)-pad;
    place(p);cv.style.zIndex=++z;stage.appendChild(cv);pieces.push(p);
    cv.addEventListener('pointerdown',e=>down(e,p));
  }
  count();
}
// The top edge: tab of piece above bulges down into this piece => this piece's top is "in" when V=+1.
// edgePath normal for left->right is upward (outward) when dir=+1, so top dir = -V[r-1][c] as computed.

function place(p){p.el.style.transform=`translate(${p.x}px,${p.y}px)`}
function count(){document.getElementById('c').textContent=`${placed}/${n*n}`}

let drag=null;
function down(e,p){
  if(p.done)return; e.preventDefault();
  if(!started){started=true;t0=Date.now();timer=setInterval(tick,500)}
  p.el.setPointerCapture(e.pointerId);p.el.classList.add('drag');p.el.style.zIndex=++z;
  drag={p,ox:e.clientX/scale-p.x,oy:e.clientY/scale-p.y};
  p.el.onpointermove=ev=>{if(!drag)return;p.x=ev.clientX/scale-drag.ox;p.y=ev.clientY/scale-drag.oy;place(p)};
  p.el.onpointerup=p.el.onpointercancel=()=>{p.el.onpointermove=null;p.el.classList.remove('drag');drag=null;
    p.x=Math.max(-p.pad,Math.min(L.W-p.sz+p.pad,p.x));p.y=Math.max(-p.pad,Math.min(L.H-p.sz+p.pad,p.y));place(p);
    const tol=B/n*.28;
    if(Math.hypot(p.x-p.tx,p.y-p.ty)<tol){p.x=p.tx;p.y=p.ty;place(p);p.done=true;p.el.classList.add('done');p.el.style.zIndex=1;placed++;count();if(placed===n*n)win()}
  };
}
function fmt(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function tick(){document.getElementById('t').textContent=fmt(Date.now()-t0)}
function win(){
  clearInterval(timer);const ms=Date.now()-t0;let best=null,key='f4-puzzle-best-'+n;
  try{best=+localStorage.getItem(key)||null;if(!best||ms<best){localStorage.setItem(key,ms);best=ms}}catch(e){best=ms}
  document.getElementById('wmsg').textContent=`أكملت ${n*n} قطعة في ${fmt(ms)}  ·  أفضل وقت: ${fmt(best)}`;
  setTimeout(()=>document.getElementById('win').classList.add('show'),350);
}
function start(){n=+document.getElementById('lvl').value;layout();build()}
document.getElementById('new').onclick=start;
document.getElementById('again').onclick=start;
document.getElementById('lvl').onchange=start;
document.getElementById('peek').onclick=e=>{const on=ghost.classList.toggle('on');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'إخفاء الصورة':'إظهار الصورة'};
addEventListener('resize',()=>L&&fit());
img.decode?img.decode().then(start,start):(img.onload=start);
</script>
</body>
</html>

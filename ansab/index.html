<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>لعبة الأنساب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: خلفية تحاكي الصفحة الرئيسية، وفوقها نافذة اللعبة في الوسط؛ شريط علوي صغير لأزرار التجربة فقط */
:root{
  --bg:#f3f0e8; --paper:#fffdf8; --ink:#1c2c47; --muted:#5d6779; --line:#e4dccb;
  --navy:#1c2c47; --navy2:#24395e; --gold:#b59559; --gold2:#e3c27a; --cream:#f6f2e8;
  --ok:#2e8b57; --okbg:#e3f3ea; --bad:#c0453b; --badbg:#fbe9e7;
  --easy:#2e8b57; --mid:#c98a1a; --hard:#b23a48;
  --font:"Tajawal",system-ui,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--paper:#162034;--ink:#eef0f5;--muted:#a6b0c2;--line:#2a3650;--okbg:#17321f;--badbg:#3a1f1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131c;--paper:#162034;--ink:#eef0f5;--muted:#a6b0c2;--line:#2a3650;--okbg:#17321f;--badbg:#3a1f1d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);direction:rtl;min-height:100vh}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px;background:#0b1220;color:#cfd6e4;font-size:13px}
.demo-bar b{color:var(--gold2)}
.demo-bar button{font:inherit;font-size:13px;font-weight:700;border:1px solid rgba(227,194,122,.5);background:transparent;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
/* خلفية الصفحة */
.page{max-width:900px;margin:0 auto;padding:18px 16px 40px;filter:blur(3px);opacity:.55;pointer-events:none}
.fake-hb{height:190px;border-radius:20px;background:linear-gradient(135deg,#1c2c47,#22365a);position:relative;overflow:hidden}
.fake-hb::before{content:"";position:absolute;inset:0;opacity:.14;background-image:linear-gradient(45deg,#d9b874 1px,transparent 1px),linear-gradient(-45deg,#d9b874 1px,transparent 1px);background-size:30px 30px}
.fake-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.fake-tiles i{height:90px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
/* النافذة */
.veil{position:fixed;inset:0;background:rgba(10,16,28,.55);display:grid;place-items:center;padding:16px;z-index:10}
.veil[hidden]{display:none}
.modal{width:100%;max-width:520px;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.mh{position:relative;background:linear-gradient(135deg,#1c2c47,#24395e);color:#fff;padding:18px 20px 16px;overflow:hidden}
.mh::before{content:"";position:absolute;inset:0;opacity:.16;background-image:linear-gradient(45deg,#d9b874 1px,transparent 1px),linear-gradient(-45deg,#d9b874 1px,transparent 1px);background-size:26px 26px}
.mh>*{position:relative}
.mh .row{display:flex;align-items:center;gap:10px}
.mh h1{margin:0;font-size:22px;font-weight:800;flex:1}
.mh h1 small{display:block;font-size:13px;font-weight:500;color:var(--gold2)}
.x{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer;flex:none}
.prog{display:flex;gap:6px;margin-top:12px}
.prog i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.18)}
.prog i.on{background:var(--gold2)}.prog i.ok{background:#5cc28a}.prog i.no{background:#e07a6f}
.mb{padding:18px 20px 20px;overflow:auto}
.msg{border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--gold) 8%,transparent);line-height:1.8}
.msg b{color:var(--gold)}
.fact{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.7}
.fact b{color:var(--ink)}
.level{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff}
.level.e{background:var(--easy)}.level.m{background:var(--mid)}.level.h{background:var(--hard)}
.q{font-size:20px;font-weight:800;line-height:1.7;margin:10px 0 14px}
.q em{font-style:normal;color:var(--gold)}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:16px;font-weight:700;text-align:right;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
.opts button:hover:not(:disabled){border-color:var(--gold)}
.opts button:disabled{cursor:default}
.opts .ok{border-color:var(--ok);background:var(--okbg)}
.opts .no{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.timer{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-weight:800;font-variant-numeric:tabular-nums}
.timer .tb{flex:1;height:7px;border-radius:6px;background:var(--line);overflow:hidden}
.timer .tb i{display:block;height:100%;width:100%;background:var(--gold);border-radius:6px;transition:width 1s linear,background .3s}
.timer.low{color:var(--bad)} .timer.low .tb i{background:var(--bad)}
.timeup{color:var(--bad);font-weight:800;margin-bottom:4px}
.why{margin-top:12px;font-size:15px;line-height:1.8;background:var(--bg);border-radius:12px;padding:10px 12px;display:none}
.why.show{display:block}
.act{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:12px;background:var(--navy);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn{background:var(--gold);color:#1c2c47}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--gold);color:#1c2c47}}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opts button:focus-visible,.x:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.score{text-align:center}
.score .big{font-size:56px;font-weight:800;color:var(--gold);line-height:1.1}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.badges span{border:1.5px solid var(--gold);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.next-visit{font-size:14px;color:var(--muted);line-height:1.8}
.pts{position:absolute;left:20px;top:16px;font-weight:800;color:var(--gold2);font-size:15px}
.float{position:fixed;font-weight:800;font-size:26px;color:var(--gold);pointer-events:none;animation:floatUp 1s forwards;z-index:20}
.target{width:64px;height:64px;flex:none}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
@keyframes hit{0%{transform:translateX(70px) rotate(-12deg);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.demo-note{max-width:900px;margin:0 auto;padding:0 16px;color:var(--muted);font-size:13px}
</style>

<div class="demo-bar" role="region" aria-label="أدوات التجربة">
  <span>تجربة: <b id="vNo">الزيارة 1</b></span>
  <button type="button" id="newVisit">محاكاة زيارة جديدة</button>
  <button type="button" id="reopen">فتح اللعبة مرة أخرى</button>
  <button type="button" id="reset">البدء من الصفر</button>
</div>
<div class="page" aria-hidden="true"><div class="fake-hb"></div><div class="fake-tiles"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>

<div class="veil" id="veil">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="gT">
    <div class="mh">
      <div class="row">
        <svg class="target" viewBox="-34 -34 68 68" aria-hidden="true"><circle r="31" fill="#1c2c47" stroke="#e3c27a" stroke-width="2"/><circle r="23" fill="#f6f2e8"/><circle r="15" fill="#1c2c47"/><circle r="7" fill="#e3c27a"/><g id="arrow" style="opacity:0"><line x1="0" y1="0" x2="34" y2="-10" stroke="#e3c27a" stroke-width="3" stroke-linecap="round"/><path d="M30-13l10-1-6 7Z" fill="#f6f2e8"/></g></svg>
        <h1 id="gT">لعبة الأنساب<small id="gSub">ثلاثة أسئلة لكل زيارة</small></h1>
        <button class="x" type="button" id="close" aria-label="إغلاق">✕</button>
      </div>
      <div class="prog" id="prog"><i></i><i></i><i></i></div>
    </div>
    <div class="mb" id="body"></div>
  </div>
</div>
<p class="demo-note">هذا نموذج للتجربة. الأسئلة تُولَّد تلقائياً من شجرة العائلة الحقيقية (الأسماء وصلات القرابة فقط). في البرنامج تظهر اللعبة مرة واحدة عند كل زيارة، وتُحفظ نتيجة كل عضو في حسابه.</p>

 m:[
  () => { const p=rnd(withF.filter(x=>P.get(P.get(x.f).f))), gf=P.get(P.get(p.f).f); return {key:'mg'+p.id, q:`من جد <em>${lbl(p,2)}</em> ${p.g==='f'?'لأبيها':'لأبيه'}؟`, ans:short(gf), opts:[gf,...distract(gf,males.filter(x=>x.id!==gf.id&&kids(x.id).length>1))].map(short), why:`${p.n1} ← ${P.get(p.f).n1} ← ${gf.n1}: جده لأبيه ${nm(gf,3)}.`}; },
  () => { for(let t=0;t<200;t++){ const a=rnd(all), b=rnd(all), r=rel(a,b); if(r&&r.L&&r.da+r.db>=2&&r.da+r.db<=3){ const pool=b.g==='m'?['عمه','خاله','أخوه الشقيق','ابن أخيه','ابن أخته','جده','حفيده','ابن عمه']:['عمته','خالته','أخته الشقيقة','ابنة أخيه','ابنة أخته','جدته','حفيدته','ابنة عمه']; const opts=[r.L,...shuffle(pool.filter(x=>x!==r.L)).slice(0,3)].map(x=>fem(x,a)); return {key:'mr'+a.id+'-'+b.id, q:`<em>${lbl(b,3)}</em> بالنسبة لـ <em>${lbl(a,3)}</em> ${huwa(b)}…`, ans:fem(r.L,a), opts, why:`يجمعهما ${nm(r.lca,2)}. ${r.pa.map(x=>x.n1).join(' ← ')} / ${r.pb.map(x=>x.n1).join(' ← ')}`}; } } },
  () => { const y=rnd(parents.filter(x=>kids(x.id).length>=3)), n=kids(y.id).length; const opts=shuffle([n,n+1,n-1,n+2].filter(x=>x>0)).slice(0,4); if(!opts.includes(n)) opts[0]=n; return {key:'mc'+y.id, q:`كم عدد أبناء وبنات <em>${lbl(y,2)}</em> المسجلين في الشجرة؟`, ans:String(n), opts:opts.map(String), why:`${kids(y.id).map(k=>k.n1).join('، ')} — المجموع ${n}.`}; },
 ],
 h:[
  () => { for(let t=0;t<300;t++){ const a=rnd(all), b=rnd(all), r=rel(a,b); if(r&&r.da>=2&&r.db>=2&&r.da+r.db>=4){ const lca=r.lca, others=distract(lca, males.filter(x=>kids(x.id).length>1&&x.id!==lca.id)); return {key:'hl'+a.id+'-'+b.id, q:`من الجد المشترك الأقرب بين <em>${lbl(a,2)}</em> و<em>${lbl(b,2)}</em>؟`, ans:short(lca), opts:[lca,...others].map(short), why:`${r.pa.map(x=>x.n1).join(' ← ')}<br>${r.pb.map(x=>x.n1).join(' ← ')}`}; } } },
  () => { for(let t=0;t<300;t++){ const a=rnd(all), b=rnd(all), r=rel(a,b); if(r&&r.L&&r.da===2&&r.db===2){ const pool=b.g==='m'?['ابن عمه','ابن خاله','ابن عمته','ابن خالته','ابن أخيه','عمه']:['ابنة عمه','ابنة خاله','ابنة عمته','ابنة خالته','ابنة أخيه','عمته']; return {key:'hr'+a.id+'-'+b.id, q:`<em>${lbl(b,3)}</em> بالنسبة لـ <em>${lbl(a,3)}</em> ${huwa(b)}…`, ans:fem(r.L,a), opts:[r.L,...shuffle(pool.filter(x=>x!==r.L)).slice(0,3)].map(x=>fem(x,a)), why:`${r.pa.map(x=>x.n1).join(' ← ')}<br>${r.pb.map(x=>x.n1).join(' ← ')}`}; } } },
  () => { const roots=all.filter(x=>!P.get(x.f)&&!P.get(x.m)&&kids(x.id).length); for(let t=0;t<300;t++){ const p=rnd(all), ma=anc(p); let far=null; ma.forEach((v,id)=>{ if(v.d>=3&&(!far||v.d>far.d)) far={...v,id}; }); if(far){ const c=P.get(far.id), d=far.d; return {key:'hd'+p.id, q:`كم جيلاً بين <em>${lbl(p,2)}</em> و${p.g==='f'?'جدها':'جده'} الأعلى <em>${nm(c,2)}</em>؟`, ans:String(d), opts:shuffle([d,d-1,d+1,d+2]).map(String), why:`${far.path.map(x=>x.n1).join(' ← ')} — ${d} أجيال.`}; } } },
 ]
};
// ===== رسائل الترحيب ووقائع الشجرة =====
const MSG = [
  'أهلاً بك في <b>شجرة العائلة</b>. ثلاثة أسئلة سريعة: سهل ومتوسط وصعب. هل تعرف أهلك؟',
  'أهلاً بعودتك! «صِلوا أرحامكم ولو بالسلام». جهّزنا لك أسئلة جديدة لم تُسأل من قبل.',
  'مرحباً من جديد. كل زيارة لعبة جديدة؛ اجمع النقاط وحافظ على سلسلة زياراتك.',
  'حيّاك الله. اليوم أسئلة عن الأجداد والأحفاد. ركّز في الصعب!',
  'زيارة جديدة، أنساب جديدة. من يعرف شجرته يعرف جذوره.',
  'أهلاً بك. هل تستطيع إصابة الهدف ثلاث مرات متتالية؟',
  'نورت الشجرة! جرّب أسئلة اليوم وقارن نتيجتك بزيارتك الماضية.',
  'السلام عليكم. سؤالك الصعب اليوم يحتاج تفكيراً في الأجيال.',
];
function facts(){
  const cnt={}; all.forEach(p=>cnt[p.n1]=(cnt[p.n1]||0)+1); const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const big=[...all].sort((a,b)=>kids(b.id).length-kids(a.id).length)[0];
  let deep=null; all.forEach(p=>{ const ma=anc(p); let d=0; ma.forEach(v=>d=Math.max(d,v.d)); if(!deep||d>deep.d) deep={p,d}; });
  const fams=new Set(all.map(p=>p.fam).filter(Boolean)).size;
  return [
    `أكثر اسم متكرر في الشجرة: <b>${top[0]}</b> (${top[1]} مرة).`,
    `أكبر أسرة مسجلة: أسرة <b>${nm(big,2)}</b> بعدد ${kids(big.id).length} من الأبناء والبنات.`,
    `أطول سلسلة نسب: <b>${deep.p.n1}</b> يرتفع نسبه ${deep.d} أجيال.`,
    `في الشجرة اليوم <b>${all.length}</b> فرداً من <b>${fams}</b> عائلة.`,
    `عدد من سُجّلت لهم زوجات وأزواج: <b>${SP.length}</b> زواجاً.`,
  ];
}
const FACTS = facts();
// ===== الحالة (في النموذج تُحفظ في المتصفح؛ في البرنامج تُحفظ في حساب العضو) =====
const KEY='ansab-demo'; let S;
try{ S=JSON.parse(localStorage.getItem(KEY)) }catch(e){}
S = S || {visit:1, asked:[], total:0, best:0, streak:0, played:false};
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
let Q=[], qi=0, score=0, results=[];
const $=id=>document.getElementById(id);
function build(){
  Q=[]; for(const lv of ['e','m','h']){ for(let t=0;t<40;t++){ const q=rnd(G[lv])(); if(q && !S.asked.includes(q.key) && new Set(q.opts).size===q.opts.length){ q.lv=lv; q.opts=shuffle(q.opts); Q.push(q); break; } } }
}
function intro(){
  $('vNo').textContent='الزيارة '+S.visit; $('gSub').textContent='الزيارة رقم '+S.visit+' · ثلاثة أسئلة جديدة';
  const msg=MSG[(S.visit-1)%MSG.length], fact=FACTS[(S.visit-1)%FACTS.length];
  setProg(-1);
  $('body').innerHTML=`<div class="msg">${msg}</div><p class="fact">💡 هل تعلم؟ ${fact}</p>
    ${S.visit>1?`<p class="fact">مجموع نقاطك حتى الآن: <b>${S.total}</b> · أفضل نتيجة: <b>${S.best}</b></p>`:''}
    <div class="act"><button class="btn" type="button" id="go">ابدأ اللعب</button><button class="btn ghost" type="button" id="later">لاحقاً</button></div>`;
  $('go').onclick=()=>{ qi=0; score=0; results=[]; show(); }; $('later').onclick=close; $('go').focus();
}
function setProg(n){ [...$('prog').children].forEach((el,i)=>{ el.className = results[i]===true?'ok':results[i]===false?'no':(i===n?'on':''); }); }
const LV={e:['سهل','e',10],m:['متوسط','m',20],h:['صعب','h',30]};
/* وقت الإجابة بالثواني حسب الصعوبة */
const TIME={e:15,m:20,h:25}; let TMR=null;
function stopTimer(){ if(TMR){ clearInterval(TMR); TMR=null; } }
function startTimer(q){
  stopTimer(); const total=TIME[q.lv]; let left=total; const box=$('tmr'), n=$('tmrN'), bar=$('tmrB');
  const draw=()=>{ n.textContent=left; bar.style.width=(left/total*100)+'%'; box.classList.toggle('low', left<=5); };
  draw(); TMR=setInterval(()=>{ left--; draw(); if(left<=0){ stopTimer(); answer(null,q); } },1000);
}
function show(){
  const q=Q[qi]; setProg(qi);
  $('body').innerHTML=`<span class="level ${LV[q.lv][1]}">${LV[q.lv][0]} · ${LV[q.lv][2]} نقطة</span>
    <div class="q">${q.q}</div><div class="timer" id="tmr" role="timer" aria-label="الوقت المتبقي">⏱ <span id="tmrN"></span><div class="tb"><i id="tmrB"></i></div></div><div class="opts" id="opts">${q.opts.map(o=>`<button type="button">${o}</button>`).join('')}</div>
    <div class="why" id="why">${q.why}</div><div class="act" id="nx" hidden><button class="btn" type="button" id="nb">${qi<Q.length-1?'السؤال التالي':'النتيجة'}</button></div>`;
  [...$('opts').children].forEach(b=>b.onclick=()=>answer(b,q)); $('opts').firstElementChild.focus(); startTimer(q);
}
function answer(b,q){
  stopTimer(); const ok=!!b && b.textContent===q.ans; [...$('opts').children].forEach(x=>{ x.disabled=true; if(x.textContent===q.ans) x.classList.add('ok'); }); if(b && !ok) b.classList.add('no');
  if(!b) $('why').insertAdjacentHTML('afterbegin','<div class="timeup">⏰ انتهى الوقت!</div>');
  results[qi]=ok; setProg(qi); S.asked.push(q.key);
  if(ok){ const pts=LV[q.lv][2]; score+=pts; floatTxt('+'+pts,b); shoot(); }
  $('why').classList.add('show'); $('nx').hidden=false; $('nb').onclick=()=>{ qi++; qi<Q.length?show():end(); }; $('nb').focus();
}
function shoot(){ const a=$('arrow'); a.style.animation='none'; void a.getBBox(); a.style.opacity=1; a.style.animation='hit .45s cubic-bezier(.3,1.4,.6,1) both'; }
function floatTxt(t,el){ const r=el.getBoundingClientRect(), s=document.createElement('div'); s.className='float'; s.textContent=t; s.style.left=(r.left+20)+'px'; s.style.top=(r.top)+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
function end(){
  const right=results.filter(Boolean).length; S.total+=score; S.best=Math.max(S.best,score); S.streak=right===3?S.streak+1:0; S.played=true; save();
  const badges=[]; if(right===3) badges.push('🎯 ثلاث إصابات'); if(results[2]) badges.push('🏆 حلّال الصعب'); if(S.streak>=2) badges.push('🔥 '+S.streak+' زيارات كاملة متتالية'); if(S.visit>=3) badges.push('🌳 زائر وفيّ');
  $('body').innerHTML=`<div class="score"><div class="big">${score}</div><div>نقطة · ${right} من 3 إجابات صحيحة</div>
    <div class="badges">${badges.map(b=>`<span>${b}</span>`).join('')||'<span>حاول في زيارتك القادمة</span>'}</div>
    <p class="next-visit">مجموع نقاطك: <b>${S.total}</b>. في زيارتك القادمة تنتظرك رسالة جديدة وثلاثة أسئلة لم تُسأل من قبل.</p>
    <div class="act"><button class="btn" type="button" id="done">متابعة إلى الموقع</button></div></div>`;
  $('done').onclick=close; $('done').focus(); setProg(9);
}
function close(){ stopTimer(); $('veil').hidden=true; }
function open(){ build(); $('veil').hidden=false; intro(); }
$('close').onclick=close;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
$('newVisit').onclick=()=>{ S.visit++; S.played=false; save(); open(); };
$('reopen').onclick=()=>{ if(!$('veil').hidden) return; open(); };
$('reset').onclick=()=>{ S={visit:1,asked:[],total:0,best:0,streak:0,played:false}; save(); open(); };
open();
</script>
